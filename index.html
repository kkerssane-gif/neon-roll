<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Neon Roll</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:#070a12;
  color:white;
}

/* --- Canvas --- */
canvas{
  display:block;
  width:100%;
  height:100%;
}

/* --- Overlay start screen --- */
.overlay{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:
    radial-gradient(800px 400px at 50% 40%, rgba(255,255,255,.12), transparent 60%),
    rgba(0,0,0,.65);
  z-index:10;
}

.panel{
  background: rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:22px;
  padding:24px;
  width:min(420px, calc(100vw - 40px));
  text-align:center;
  backdrop-filter: blur(12px);
}

.panel h1{
  margin:0 0 10px;
  font-size:22px;
}

.panel p{
  margin:0 0 20px;
  font-size:14px;
  opacity:.85;
}

button{
  appearance:none;
  border:none;
  border-radius:18px;
  padding:16px 20px;
  font-size:18px;
  font-weight:800;
  color:#0b1020;
  background: linear-gradient(135deg,#22d3ee,#fb7185);
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
  <div class="panel">
    <h1>Neon Roll</h1>
    <p>Touche pour jouer.<br/>Glisse à gauche / droite.</p>
    <button id="startBtn">▶ JOUER</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.159.0/build/three.min.js"></script>

<script>
/* =========================
   THREE.JS SETUP
========================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(1);            // IMPORTANT mobile
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;   // IMPORTANT mobile
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a12, 0.06);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);
camera.position.set(0,6,10);

/* Lights */
scene.add(new THREE.HemisphereLight(0x99ccff,0x220022,0.9));

/* World */
const world = new THREE.Group();
scene.add(world);

/* Track */
const track = new THREE.Mesh(
  new THREE.BoxGeometry(6,0.6,200),
  new THREE.MeshStandardMaterial({ color:0x0b1020 })
);
track.position.y = -0.5;
world.add(track);

/* Ball */
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.5,24,24),
  new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0x003344,
    emissiveIntensity:2
  })
);
ball.position.set(0,0.4,0);
world.add(ball);

/* =========================
   GAME STATE
========================= */
let running = false;
let loopStarted = false;
let targetX = 0;
let speed = 0.18;

/* =========================
   INPUT
========================= */
let startX = 0;
let baseX = 0;
let touching = false;

window.addEventListener("pointerdown", e=>{
  touching = true;
  startX = e.clientX;
  baseX = targetX;
},{passive:true});

window.addEventListener("pointermove", e=>{
  if(!touching) return;
  const dx = e.clientX - startX;
  targetX = baseX + dx / 120;
  targetX = Math.max(-2.2, Math.min(2.2, targetX));
},{passive:true});

window.addEventListener("pointerup", ()=> touching=false,{passive:true});
window.addEventListener("pointercancel", ()=> touching=false,{passive:true});

/* =========================
   LOOP
========================= */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  if(!running){
    renderer.render(scene,camera);
    return;
  }

  const dt = clock.getDelta();

  ball.position.x += (targetX - ball.position.x) * 0.15;
  ball.rotation.x -= speed * 1.5;
  ball.rotation.z = -ball.position.x * 0.1;

  track.position.z += speed;
  if(track.position.z > 0) track.position.z = -100;

  camera.lookAt(ball.position.x,0.5,ball.position.z - 6);

  renderer.render(scene,camera);
}

/* =========================
   START BUTTON (CRITICAL)
========================= */
const overlayEl = document.getElementById("overlay");
const startBtn  = document.getElementById("startBtn");

function startLoopOnce(){
  if(loopStarted) return;
  loopStarted = true;
  animate();
}

startBtn.addEventListener("click", ()=>{
  startLoopOnce();      // débloque WebGL iOS/Android
  running = true;
  overlayEl.style.display = "none";
});

/* Resize */
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
